name: Bug report
description: Something in .claude/ behaves differently from what its file says it does.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is not a Java application: it has no `pom.xml` and nothing to
        compile. Bugs live in instruction files, blueprints, data, `ArchHook.java`, or in
        the project a generator run produced.

        Before filing, run `/arch-doctor` (or `java .claude/hooks/ArchHook.java doctor`)
        and paste its output below — most setup problems are diagnosed by it.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I read the relevant record in `.claude/decisions/`, and this is a defect, not a design decision I disagree with.
          required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      description: The meta-repository generates projects; a bug can live on either side.
      options:
        - In this meta-repository (claude-spring-architect)
        - In a project generated by /init-project
        - Both
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - skills/ (a slash command or a skill the model invoked)
        - agents/ (archunit-installer, commons-logging-installer, java-spring-boot-developer, project-initializer)
        - hooks/ArchHook.java (check, doctor, compose, audit, schema)
        - blueprints/ (an architecture declared as data)
        - rules/ (a norm)
        - .mcp.json / MCP servers
        - settings.json / permissions
        - docs/ or README
        - CI (validate.yml)
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: entrypoint
    attributes:
      label: Exact entry point
      description: The command you typed, or the skill/agent/hook mode that ran.
      placeholder: "/new-feature register a customer  —  or: java .claude/hooks/ArchHook.java compose"
    validations:
      required: true

  - type: input
    id: blueprint
    attributes:
      label: Active blueprint
      description: Only if the bug involves a generated project or a blueprint. Leave blank otherwise.
      placeholder: hexagonal, clean-architecture-multi-module, onion, layered, vertical-slice, modular-monolith, custom-template

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Quote the file and line that promises it — a norm, a `SKILL.md`, a blueprint field, an invariant in `CLAUDE.md`.
      placeholder: |
        `.claude/rules/architecture-ddd.md` says the domain must not import `tools.jackson`,
        so the check should have failed on that import.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Paste the decisive output. Quote error messages exactly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a clean clone, if possible. Say whether the session was restarted — `settings.json` and `.mcp.json` are only read at startup.
      placeholder: |
        1. Clone the repository, `claude` in the root.
        2. Run `/init-project` and pick the `hexagonal` blueprint.
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of /arch-doctor
      description: Or `java .claude/hooks/ArchHook.java doctor`. Redact tokens and paths you would rather not publish.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Output of `java -version`, `git --version`, `claude --version`, plus your OS.
      value: |
        - OS:
        - java -version:
        - git --version:
        - claude --version:
    validations:
      required: true
